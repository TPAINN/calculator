<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Calculator — A minimal four-function calculator. React state, nothing else.">
<title>Calculator</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a18"/><stop offset="1" stop-color="#150a12"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#f472b6" stop-opacity=".45"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #a78bfa)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<g class="float"><rect x="822" y="40" width="334" height="288" rx="26" fill="#0f0d19" stroke="url(#g1)" stroke-opacity=".6"/><rect x="840" y="58" width="298" height="64" rx="14" fill="#fff" opacity=".06"/><text x="1122" y="102" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="38" font-weight="700" fill="#fff">3.14159</text><g><rect x="840" y="138" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="876" y="163" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">7</text></g><g><rect x="922" y="138" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="958" y="163" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">8</text></g><g><rect x="1004" y="138" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="1040" y="163" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">9</text></g><g><rect x="1086" y="138" width="72" height="36" rx="10" fill="#a78bfa" opacity="0.95"/><text x="1122" y="163" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0b0a12">÷</text></g><g><rect x="840" y="182" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="876" y="207" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">4</text></g><g><rect x="922" y="182" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="958" y="207" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">5</text></g><g><rect x="1004" y="182" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="1040" y="207" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">6</text></g><g><rect x="1086" y="182" width="72" height="36" rx="10" fill="#a78bfa" opacity="0.95"/><text x="1122" y="207" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0b0a12">×</text></g><g><rect x="840" y="226" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="876" y="251" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">1</text></g><g><rect x="922" y="226" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="958" y="251" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">2</text></g><g><rect x="1004" y="226" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="1040" y="251" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">3</text></g><g><rect x="1086" y="226" width="72" height="36" rx="10" fill="#a78bfa" opacity="0.95"/><text x="1122" y="251" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0b0a12">−</text></g><g><rect x="840" y="270" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="876" y="295" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">0</text></g><g><rect x="922" y="270" width="72" height="36" rx="10" fill="#fff" opacity="0.1"/><text x="958" y="295" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">.</text></g><g class="pulse"><rect x="1004" y="270" width="72" height="36" rx="10" fill="#a78bfa" opacity="0.95"/><text x="1040" y="295" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0b0a12">=</text></g><g><rect x="1086" y="270" width="72" height="36" rx="10" fill="#a78bfa" opacity="0.95"/><text x="1122" y="295" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0b0a12">+</text></g></g>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">Calculator</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">A minimal four-function calculator. React state,</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">nothing else.</text>
<g transform="translate(72 292)"><rect width="76" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/><text x="38" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">React</text></g><g transform="translate(158 292)"><rect width="67" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/><text x="33" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Vite</text></g>
<rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".35" stroke-width="1.5"/>
</g>
</svg>
